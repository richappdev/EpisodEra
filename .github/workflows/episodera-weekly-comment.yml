name: Episodera Weekly Comment Journey

on:
  workflow_dispatch:
    inputs:
      enable_comment:
        description: Post or verify one persistent account comment
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 12 * * 0"

permissions:
  contents: read

concurrency:
  group: episodera-production-smoke
  cancel-in-progress: false

jobs:
  comment:
    name: Weekly spoiler-safe comment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EPISODERA_HOSTING_URL: https://episodera.web.app
      EPISODERA_PROD_API_BASE_URL: ${{ vars.EPISODERA_PROD_API_BASE_URL || 'https://api-m74gmd4u4a-uc.a.run.app' }}
      EPISODERA_TEST_EMAIL: ${{ secrets.EPISODERA_TEST_EMAIL || secrets.EPISODERA_SMOKE_EMAIL }}
      EPISODERA_TEST_PASSWORD: ${{ secrets.EPISODERA_TEST_PASSWORD || secrets.EPISODERA_SMOKE_PASSWORD }}
      EPISODERA_SMOKE_APP_CHECK_BYPASS: ${{ secrets.EPISODERA_SMOKE_APP_CHECK_BYPASS || secrets.SMOKE_BYPASS_APP_CHECK_SECRET }}
      EPISODERA_ENABLE_COMMENTS: ${{ (github.event_name == 'schedule' || inputs.enable_comment) && 'true' || 'false' }}
      EPISODERA_FORCE_COMMENT: ${{ (github.event_name == 'schedule' || inputs.enable_comment) && 'true' || 'false' }}
      EPISODERA_COMMENT_PROBABILITY: ${{ (github.event_name == 'schedule' || inputs.enable_comment) && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Restore persistent comment fingerprints
        uses: actions/cache@v4
        with:
          path: web/test-results/smoke-account-state.json
          key: episodera-smoke-account-state-${{ github.run_id }}
          restore-keys: |
            episodera-smoke-account-state-

      - name: Validate comment credentials
        if: github.event_name == 'schedule' || inputs.enable_comment
        run: |
          missing=0
          for name in EPISODERA_TEST_EMAIL EPISODERA_TEST_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run weekly comment journey
        if: github.event_name == 'schedule' || inputs.enable_comment
        working-directory: web
        run: npm run test:smoke:comment

      - name: Skip manual comment journey without opt-in
        if: github.event_name == 'workflow_dispatch' && !inputs.enable_comment
        run: echo "::notice::Weekly comment journey skipped because enable_comment was not selected."

      - name: Write failure notification payload
        if: failure()
        run: |
          mkdir -p web/test-results
          cat > web/test-results/failure-notification.json <<JSON
          {
            "status": "failure",
            "workflow": "${GITHUB_WORKFLOW}",
            "productionUrl": "https://episodera.web.app",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": "Playwright report, traces, screenshots, videos"
          }
          JSON

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodera-weekly-comment-diagnostics-${{ github.run_id }}
          path: |
            web/test-results/**
            web/playwright-report/smoke/**
          retention-days: 14
          if-no-files-found: warn
