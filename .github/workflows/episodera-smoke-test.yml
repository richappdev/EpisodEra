name: Episodera Daily Smoke Test

on:
  workflow_dispatch:
    inputs:
      enable_comments:
        description: Allow occasional comment creation for this manual run
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "web/playwright.smoke.config.ts"
      - "web/tests/smoke/**"
      - "web/tests/helpers/**"
      - ".github/workflows/episodera-smoke-test.yml"
      - ".github/workflows/episodera-weekly-comment.yml"
      - "SMOKE_TEST.md"
      - ".env.example"
      - "web/.env.smoke.example"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/src/pages/AuthPage.tsx"
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: read

concurrency:
  group: episodera-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production movie-lover smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EPISODERA_HOSTING_URL: https://episodera.web.app
      EPISODERA_PROD_API_BASE_URL: ${{ vars.EPISODERA_PROD_API_BASE_URL || 'https://api-m74gmd4u4a-uc.a.run.app' }}
      EPISODERA_TEST_EMAIL: ${{ secrets.EPISODERA_TEST_EMAIL || secrets.EPISODERA_SMOKE_EMAIL }}
      EPISODERA_TEST_PASSWORD: ${{ secrets.EPISODERA_TEST_PASSWORD || secrets.EPISODERA_SMOKE_PASSWORD }}
      EPISODERA_SMOKE_APP_CHECK_BYPASS: ${{ secrets.EPISODERA_SMOKE_APP_CHECK_BYPASS || secrets.SMOKE_BYPASS_APP_CHECK_SECRET }}
      EPISODERA_ENABLE_COMMENTS: ${{ ((github.event_name == 'schedule' && vars.EPISODERA_ENABLE_COMMENTS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.enable_comments)) && 'true' || 'false' }}
      EPISODERA_COMMENT_PROBABILITY: ${{ vars.EPISODERA_COMMENT_PROBABILITY || '0.20' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Record smoke start time
        id: context
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Restore persistent comment fingerprints
        uses: actions/cache@v4
        with:
          path: web/test-results/smoke-account-state.json
          key: episodera-smoke-account-state-${{ github.run_id }}
          restore-keys: |
            episodera-smoke-account-state-

      - name: Detect authenticated smoke credentials
        id: credentials
        run: |
          if [ -n "$EPISODERA_TEST_EMAIL" ] && [ -n "$EPISODERA_TEST_PASSWORD" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::error::Scheduled smoke requires EPISODERA_TEST_EMAIL/EPISODERA_TEST_PASSWORD or the EPISODERA_SMOKE_* aliases."
              exit 1
            fi
            echo "::notice::Authenticated smoke skipped for this non-scheduled run because smoke credentials are missing."
          fi

      - name: Run public smoke test
        id: public
        working-directory: web
        run: npm run test:smoke:public

      - name: Run authenticated movie-lover journey
        id: auth
        if: steps.credentials.outputs.has_auth == 'true'
        working-directory: web
        run: npm run test:smoke:auth

      - name: Write smoke run summary
        if: always()
        run: |
          started_epoch="${{ steps.context.outputs.started_epoch }}"
          if [ -n "$started_epoch" ]; then
            duration="$(($(date +%s) - started_epoch))s"
          else
            duration="n/a"
          fi
          {
            echo "## Daily production smoke"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | $EPISODERA_HOSTING_URL |"
            echo "| API | $EPISODERA_PROD_API_BASE_URL |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Trigger | $GITHUB_EVENT_NAME |"
            echo "| Public smoke | ${{ steps.public.outcome || 'not-run' }} |"
            echo "| Authenticated smoke | ${{ steps.auth.outcome || 'skipped' }} |"
            echo "| Credentials configured | ${{ steps.credentials.outputs.has_auth || 'false' }} |"
            echo "| Duration | $duration |"
            echo "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure notification payload
        if: failure()
        run: |
          mkdir -p web/test-results
          cat > web/test-results/failure-notification.json <<JSON
          {
            "status": "failure",
            "workflow": "${GITHUB_WORKFLOW}",
            "productionUrl": "https://episodera.web.app",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": "Playwright report, traces, screenshots, videos"
          }
          JSON

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodera-smoke-diagnostics-${{ github.run_id }}
          path: |
            web/test-results/**
            web/playwright-report/smoke/**
          retention-days: 14
          if-no-files-found: warn
